  <style>
/* ===== 云舒 · 全局样式（禅意道教版） ===== */
:root {
  --bg-deep: #0B0A09;
  --bg-primary: #121110;
  --bg-secondary: #1A1917;
  --bg-card: rgba(28, 26, 24, 0.55);
  --bg-card-hover: #24211E;
  --border-gold: rgba(201, 169, 110, 0.22);
  --border-gold-strong: rgba(201, 169, 110, 0.5);
  --gold-primary: #C9A96E;
  --gold-light: #E8D5A3;
  --gold-dark: #8B7355;
  /* 道教青 */
  --dao-teal: #5B8C5A;
  --dao-teal-light: #7BA68A;
  --dao-teal-dark: #3E6348;
  /* 朱砂红 */
  --cinnabar: #A94438;
  --cinnabar-light: #C85A4D;
  /* 文字 */
  --text-primary: #E8E4DC;
  --text-secondary: #A8A095;
  --text-muted: #6B6459;
  --text-ink: #C9C4BA;
  --glow-gold: rgba(201, 169, 110, 0.18);
  --glow-gold-strong: rgba(201, 169, 110, 0.35);
  --glow-teal: rgba(91, 140, 90, 0.2);
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --font-sans: 'Noto Sans SC', 'PingFang SC', -apple-system, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-deep);
  color: var(--text-primary);
  line-height: 1.75;
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}

/* ===== 整体禅意背景 ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    /* 顶部金光 */
    radial-gradient(ellipse at 50% -10%, rgba(201, 169, 110, 0.1) 0%, transparent 40%),
    /* 底部道教青微光 */
    radial-gradient(ellipse at 50% 110%, rgba(91, 140, 90, 0.06) 0%, transparent 45%),
    /* 水墨晕染 */
    radial-gradient(ellipse at 15% 30%, rgba(180, 170, 150, 0.04) 0%, transparent 30%),
    radial-gradient(ellipse at 85% 70%, rgba(180, 170, 150, 0.03) 0%, transparent 25%);
  pointer-events: none;
  z-index: 0;
}

/* 祥云纹背景 */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(circle at 20% 80%, rgba(201, 169, 110, 0.02) 2px, transparent 3px),
    radial-gradient(circle at 80% 20%, rgba(201, 169, 110, 0.015) 2px, transparent 3px),
    radial-gradient(circle at 60% 60%, rgba(91, 140, 90, 0.02) 1px, transparent 2px);
  background-size: 120px 120px, 160px 160px, 80px 80px;
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}

#root {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
}

/* 页面容器 */
.page {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  padding-bottom: calc(48px + var(--safe-bottom));
}

/* 页面过渡 */
.page-enter {
  animation: pageEnter 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
}

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 烫金文字 */
.gold-text {
  background: linear-gradient(135deg, #F5E6C8 0%, #C9A96E 35%, #E8D5A3 55%, #C9A96E 75%, #8B7355 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-fill-color: transparent;
}

/* 道教青文字 */
.teal-text {
  background: linear-gradient(135deg, #9CC4A0 0%, #5B8C5A 50%, #7BA68A 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-fill-color: transparent;
}

/* ===== 顶部导航 ===== */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(14px + var(--safe-top)) 20px 14px;
  background: linear-gradient(to bottom, rgba(11, 10, 9, 0.97) 0%, rgba(11, 10, 9, 0.88) 70%, transparent 100%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.nav-bar.with-back {
  justify-content: space-between;
}

.back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border-gold);
  border-radius: 50%;
  background: rgba(201, 169, 110, 0.05);
  color: var(--gold-light);
  cursor: pointer;
  transition: all 0.25s ease;
}

.back-btn:active {
  transform: scale(0.92);
  background: rgba(201, 169, 110, 0.18);
  border-color: var(--border-gold-strong);
}

.nav-title {
  flex: 1;
  text-align: center;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 4px;
  margin: 0 12px;
}

.nav-placeholder { width: 40px; height: 40px; }

/* ===== 首页 ===== */
.home-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 60px 28px 32px;
  text-align: center;
  position: relative;
}

/* 水墨山水装饰 */
.home-deco-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 200px;
  pointer-events: none;
  opacity: 0.4;
}

.home-deco-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 180px;
  pointer-events: none;
  opacity: 0.3;
}

/* 太极装饰（左上角） */
.home-taiji-left {
  position: absolute;
  top: 60px;
  left: -30px;
  width: 100px;
  height: 100px;
  opacity: 0.06;
  pointer-events: none;
  animation: taijiSpin 60s linear infinite;
}

/* 八卦装饰（右上角） */
.home-bagua-right {
  position: absolute;
  top: 80px;
  right: -40px;
  width: 120px;
  height: 120px;
  opacity: 0.05;
  pointer-events: none;
  animation: baguaSpin 90s linear infinite reverse;
}

@keyframes taijiSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes baguaSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* 莲花/香炉烛火 */
.home-censer {
  margin-bottom: 24px;
  position: relative;
}

.home-censer .flame {
  animation: flameSway 3.2s ease-in-out infinite;
  transform-origin: bottom center;
}

.home-censer .smoke {
  animation: smokeRise 4s ease-in-out infinite;
  transform-origin: bottom center;
  opacity: 0.6;
}

.home-censer .smoke-2 {
  animation: smokeRise 5s ease-in-out infinite 1s;
}

.home-censer .smoke-3 {
  animation: smokeRise 4.5s ease-in-out infinite 0.5s;
}

@keyframes flameSway {
  0%, 100% { transform: scale(1) skewX(0deg); opacity: 1; }
  25% { transform: scale(1.05, 0.95) skewX(-1deg); opacity: 0.93; }
  50% { transform: scale(0.95, 1.05) skewX(1deg); opacity: 1; }
  75% { transform: scale(1.02, 0.98) skewX(-0.5deg); opacity: 0.96; }
}

@keyframes smokeRise {
  0% { transform: translateY(0) scale(1); opacity: 0.6; }
  50% { transform: translateY(-12px) scale(1.1); opacity: 0.35; }
  100% { transform: translateY(-24px) scale(1.2); opacity: 0; }
}

.home-brand {
  font-family: var(--font-serif);
  font-size: 68px;
  font-weight: 900;
  letter-spacing: 14px;
  line-height: 1.05;
  margin-bottom: 18px;
  padding-left: 14px;
  background: linear-gradient(180deg, #F5E6C8 0%, #C9A96E 45%, #E8D5A3 60%, #C9A96E 80%, #8B7355 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 80px rgba(201, 169, 110, 0.2);
  position: relative;
}

/* 印章装饰 */
.home-seal {
  display: inline-block;
  margin: 0 auto 20px;
  padding: 6px 10px;
  background: rgba(169, 68, 56, 0.15);
  border: 1px solid rgba(169, 68, 56, 0.4);
  color: var(--cinnabar-light);
  font-family: var(--font-serif);
  font-size: 11px;
  letter-spacing: 4px;
  border-radius: 3px;
  transform: rotate(-2deg);
}

.home-slogan {
  font-family: var(--font-serif);
  font-size: 15px;
  letter-spacing: 8px;
  color: var(--gold-primary);
  margin-bottom: 4px;
  padding-left: 8px;
  font-weight: 500;
}

.home-slogan-en {
  font-size: 10.5px;
  letter-spacing: 5px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 48px;
  padding-left: 5px;
  opacity: 0.8;
}

/* 回纹分隔装饰 */
.huiwen-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin-bottom: 36px;
  gap: 14px;
}

.huiwen-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border-gold-strong), transparent);
  position: relative;
}

.huiwen-dot {
  width: 8px;
  height: 8px;
  border: 1px solid var(--gold-primary);
  transform: rotate(45deg);
  opacity: 0.7;
}

/* 入口卡片 */
.entry-cards {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 44px;
}

.entry-card {
  position: relative;
  display: flex;
  align-items: center;
  padding: 24px 22px;
  border-radius: 16px;
  background:
    linear-gradient(135deg, rgba(28, 26, 24, 0.85) 0%, rgba(18, 17, 16, 0.85) 100%);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  text-align: left;
  overflow: hidden;
}

.entry-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(201, 169, 110, 0.5), rgba(201, 169, 110, 0.08) 40%, rgba(91, 140, 90, 0.3) 70%, rgba(201, 169, 110, 0.4));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* 祥云角饰 */
.entry-card::after {
  content: '';
  position: absolute;
  top: 8px;
  right: 10px;
  width: 40px;
  height: 40px;
  background: radial-gradient(circle at 30% 30%, rgba(201, 169, 110, 0.06) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.entry-card:active {
  transform: scale(0.985);
  background: linear-gradient(135deg, rgba(36, 33, 30, 0.92) 0%, rgba(26, 25, 23, 0.92) 100%);
}

.entry-card .card-number {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--gold-primary);
  margin-right: 20px;
  opacity: 0.75;
  min-width: 46px;
  position: relative;
}

/* 编号下方的卦象线条装饰 */
.entry-card .card-number::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 2px;
  width: 20px;
  height: 2px;
  background: linear-gradient(to right, var(--gold-primary), transparent);
}

.entry-card .card-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.entry-card .card-en {
  font-size: 10.5px;
  letter-spacing: 4px;
  color: var(--dao-teal-light);
  text-transform: uppercase;
  opacity: 0.8;
}

.entry-card .card-title {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--text-primary);
}

.entry-card .card-arrow {
  color: var(--gold-primary);
  opacity: 0.6;
  transition: all 0.3s ease;
}

.entry-card:active .card-arrow {
  opacity: 1;
  transform: translateX(4px);
}

/* 首页底部 */
.home-footer {
  font-size: 11.5px;
  letter-spacing: 5px;
  color: var(--text-muted);
  font-family: var(--font-serif);
  padding-left: 5px;
  opacity: 0.85;
}

.home-footer .sep {
  color: var(--gold-dark);
  margin: 0 10px;
  font-size: 8px;
  opacity: 0.7;
}

/* ===== 分割线 ===== */
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 28px 0;
  padding: 0 24px;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border-gold-strong), transparent);
}

.divider-icon {
  width: 6px;
  height: 6px;
  background: var(--gold-primary);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--glow-gold-strong);
}

.divider-text {
  font-family: var(--font-serif);
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--gold-primary);
  padding: 0 8px;
}

/* ===== 页面通用 ===== */
.page-content {
  padding: 8px 20px 0;
}

.page-header {
  padding: 12px 0 24px;
  text-align: center;
  position: relative;
}

.page-header-title {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 5px;
  margin-bottom: 8px;
}

.page-header-subtitle {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--dao-teal-light);
  text-transform: uppercase;
  opacity: 0.8;
}

/* 说明文字区 */
.intro-block {
  position: relative;
  background: rgba(28, 26, 24, 0.5);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 20px 20px 18px;
  margin-bottom: 24px;
  overflow: hidden;
}

/* 竹节装饰角 */
.intro-block::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 40px; height: 40px;
  border-top: 2px solid var(--dao-teal);
  border-left: 2px solid var(--dao-teal);
  border-radius: 12px 0 0 0;
  opacity: 0.4;
}

.intro-block::after {
  content: '';
  position: absolute;
  bottom: 0; right: 0;
  width: 40px; height: 40px;
  border-bottom: 2px solid var(--dao-teal);
  border-right: 2px solid var(--dao-teal);
  border-radius: 0 0 12px 0;
  opacity: 0.4;
}

.intro-title {
  font-family: var(--font-serif);
  font-size: 16px;
  letter-spacing: 3px;
  color: var(--gold-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}

.intro-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 16px;
  background: linear-gradient(to bottom, var(--gold-light), var(--gold-primary));
  border-radius: 2px;
}

.intro-text {
  font-size: 14px;
  line-height: 1.95;
  color: var(--text-secondary);
  text-indent: 2em;
}

/* 小卡片组 */
.info-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}

.info-card {
  position: relative;
  background: rgba(28, 26, 24, 0.45);
  border: 1px solid rgba(91, 140, 90, 0.25);
  border-radius: 10px;
  padding: 16px 14px 14px;
  overflow: hidden;
}

.info-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right, transparent, var(--dao-teal), transparent);
  opacity: 0.5;
}

.info-card-icon {
  color: var(--dao-teal-light);
  margin-bottom: 10px;
  opacity: 0.9;
}

.info-card-title {
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.info-card-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.7;
}

/* ===== 蜡烛列表 ===== */
.candle-list-section-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--text-primary);
  margin-bottom: 16px;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.candle-list-section-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 18px;
  background: linear-gradient(to bottom, var(--gold-light), var(--gold-primary));
  border-radius: 2px;
}

.candle-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.candle-item {
  position: relative;
  display: flex;
  align-items: center;
  padding: 18px 18px 18px 16px;
  background: rgba(28, 26, 24, 0.5);
  border: 1px solid rgba(201, 169, 110, 0.18);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  overflow: hidden;
}

/* 左边金色竖条 */
.candle-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(to bottom, var(--gold-light), var(--gold-primary), var(--gold-dark));
  border-radius: 3px 0 0 3px;
  opacity: 0.7;
}

.candle-item:active {
  transform: scale(0.985);
  border-color: var(--border-gold-strong);
  background: rgba(36, 33, 30, 0.7);
}

.candle-item:active::before {
  opacity: 1;
}

.candle-color-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  margin: 0 18px 0 6px;
  flex-shrink: 0;
  box-shadow: 0 0 12px currentColor;
  position: relative;
}

.candle-color-dot::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid currentColor;
  opacity: 0.25;
}

.candle-item.bole-color .candle-color-dot {
  box-shadow: 0 0 0 2px var(--gold-primary), 0 0 14px rgba(201, 169, 110, 0.4);
}

.candle-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.candle-name {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 6px;
  color: var(--text-primary);
  padding-left: 6px;
}

.candle-core {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.6;
  padding-left: 6px;
}

.candle-arrow {
  color: var(--gold-primary);
  opacity: 0.5;
  margin-left: 8px;
  flex-shrink: 0;
}

.candle-item:active .candle-arrow {
  opacity: 1;
  transform: translateX(3px);
}

/* ===== 蜡烛详情页 ===== */
.detail-page .detail-hero {
  padding: 28px 20px 24px;
  text-align: center;
  position: relative;
}

/* 详情页顶部水墨晕染 */
.detail-page .detail-hero::before {
  content: '';
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 200px;
  background: radial-gradient(ellipse at center, rgba(201, 169, 110, 0.08) 0%, transparent 60%);
  pointer-events: none;
}

.detail-color-circle {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 24px;
  position: relative;
  animation: colorGlow 4s ease-in-out infinite;
}

@keyframes colorGlow {
  0%, 100% { box-shadow: 0 0 20px currentColor; }
  50% { box-shadow: 0 0 40px currentColor, 0 0 60px currentColor; }
}

/* 色圈呼吸（播放时激活） */
.detail-color-circle.playing {
  animation: colorPulse 1.2s ease-in-out infinite;
}

@keyframes colorPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 25px currentColor; }
  50% { transform: scale(1.08); box-shadow: 0 0 50px currentColor, 0 0 70px currentColor; }
}

.detail-color-circle::after {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 1px solid rgba(201, 169, 110, 0.25);
}

.detail-color-circle::before {
  content: '';
  position: absolute;
  inset: -24px;
  border-radius: 50%;
  border: 1px solid rgba(201, 169, 110, 0.12);
}

.bole-color .detail-color-circle {
  box-shadow: 0 0 0 2px var(--gold-primary), 0 0 30px rgba(201, 169, 110, 0.35);
}

.detail-name {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 10px;
  margin-bottom: 6px;
  padding-left: 10px;
}

.detail-subtitle {
  font-size: 14px;
  letter-spacing: 5px;
  color: var(--gold-primary);
  margin-bottom: 14px;
  padding-left: 5px;
}

.detail-core {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.9;
  padding: 0 14px;
}

/* 诗句区 */
.detail-poem {
  margin: 28px 20px 24px;
  padding: 28px 24px 24px;
  background: rgba(28, 26, 24, 0.45);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  position: relative;
}

.detail-poem::before {
  content: '「';
  position: absolute;
  top: 6px;
  left: 14px;
  font-family: var(--font-serif);
  font-size: 42px;
  color: var(--gold-primary);
  opacity: 0.2;
  line-height: 1;
}

.detail-poem::after {
  content: '」';
  position: absolute;
  bottom: -10px;
  right: 14px;
  font-family: var(--font-serif);
  font-size: 42px;
  color: var(--gold-primary);
  opacity: 0.2;
  line-height: 1;
}

.poem-line {
  font-family: var(--font-serif);
  font-size: 15.5px;
  line-height: 2.3;
  letter-spacing: 2px;
  color: var(--text-primary);
  text-align: center;
}

.poem-line.top { text-align: right; }
.poem-line.bottom { text-align: left; margin-top: 8px; }

/* 详情条目 */
.detail-sections {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 24px;
}

.detail-section {
  position: relative;
  background: rgba(28, 26, 24, 0.45);
  border: 1px solid rgba(201, 169, 110, 0.16);
  border-radius: 12px;
  padding: 16px 18px 18px;
  overflow: hidden;
}

/* 顶部回纹装饰条 */
.detail-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background:
    linear-gradient(90deg,
      transparent 0%,
      var(--dao-teal) 15%,
      transparent 30%,
      var(--dao-teal) 50%,
      transparent 70%,
      var(--dao-teal) 85%,
      transparent 100%
    );
  opacity: 0.35;
}

.detail-section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.detail-section-icon {
  color: var(--dao-teal-light);
  opacity: 0.9;
}

.detail-section-title {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-primary);
}

.detail-section-text {
  font-size: 13.5px;
  line-height: 1.9;
  color: var(--text-secondary);
}

/* ===== 音乐播放器 ===== */
.music-player {
  margin: 0 20px 28px;
  background: linear-gradient(135deg, rgba(28, 26, 24, 0.7) 0%, rgba(18, 17, 16, 0.7) 100%);
  border: 1px solid var(--border-gold-strong);
  border-radius: 14px;
  padding: 20px 18px 18px;
  position: relative;
  overflow: hidden;
}

.music-player::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 100px; height: 100px;
  background: radial-gradient(circle, rgba(201, 169, 110, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.player-title {
  font-family: var(--font-serif);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--gold-primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-title .play-status {
  font-size: 11px;
  color: var(--dao-teal-light);
  letter-spacing: 2px;
  margin-left: auto;
  font-family: var(--font-sans);
}

.player-main {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.play-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
  border: none;
  color: #1A150E;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 16px rgba(201, 169, 110, 0.35);
  flex-shrink: 0;
}

.play-btn:active {
  transform: scale(0.92);
  box-shadow: 0 2px 8px rgba(201, 169, 110, 0.25);
}

.play-btn.playing {
  animation: playBtnPulse 2s ease-in-out infinite;
}

@keyframes playBtnPulse {
  0%, 100% { box-shadow: 0 4px 16px rgba(201, 169, 110, 0.35); }
  50% { box-shadow: 0 4px 24px rgba(201, 169, 110, 0.55), 0 0 40px rgba(201, 169, 110, 0.2); }
}

.player-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.player-track-name {
  font-size: 13px;
  color: var(--text-primary);
  letter-spacing: 1px;
}

.player-time {
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.player-time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  margin-bottom: 10px;
  opacity: 0.75;
}

.play-btn.loading {
  opacity: 0.7;
  cursor: wait;
}

.player-progress {
  width: 100%;
  height: 4px;
  background: rgba(201, 169, 110, 0.15);
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  margin-bottom: 10px;
}

.player-progress-bar {
  height: 100%;
  background: linear-gradient(to right, var(--gold-dark), var(--gold-primary), var(--gold-light));
  border-radius: 2px;
  transition: width 0.1s linear;
}

.player-controls-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.volume-icon {
  color: var(--gold-primary);
  opacity: 0.7;
  flex-shrink: 0;
}

.volume-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: rgba(201, 169, 110, 0.15);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold-primary);
  cursor: pointer;
  box-shadow: 0 0 6px rgba(201, 169, 110, 0.5);
}

.volume-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold-primary);
  cursor: pointer;
  border: none;
}

/* ===== 仪式指南页 ===== */
.ritual-steps {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 0 20px;
  margin-bottom: 32px;
}

.ritual-step {
  position: relative;
  background: rgba(28, 26, 24, 0.5);
  border: 1px solid rgba(201, 169, 110, 0.2);
  border-radius: 14px;
  padding: 24px 22px 22px;
  overflow: hidden;
}

/* 符箓风格左边装饰 */
.ritual-step::before {
  content: '';
  position: absolute;
  top: 12px;
  left: 8px;
  width: 3px;
  height: calc(100% - 24px);
  background: linear-gradient(to bottom,
    var(--gold-primary) 0%,
    var(--cinnabar) 25%,
    var(--gold-primary) 50%,
    var(--cinnabar) 75%,
    var(--gold-primary) 100%
  );
  border-radius: 3px;
  opacity: 0.6;
}

/* 右上角八卦纹装饰 */
.ritual-step::after {
  content: '';
  position: absolute;
  top: 12px;
  right: 14px;
  width: 24px;
  height: 24px;
  border: 1px solid rgba(91, 140, 90, 0.3);
  border-radius: 50%;
  opacity: 0.5;
}

.ritual-step-head {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  margin-bottom: 16px;
  padding-left: 18px;
}

.ritual-step-num {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
  color: var(--gold-primary);
  opacity: 0.75;
  min-width: 52px;
  letter-spacing: 1px;
}

.ritual-step-title-wrap {
  flex: 1;
}

.ritual-step-en {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--dao-teal-light);
  text-transform: uppercase;
  margin-bottom: 3px;
  opacity: 0.8;
}

.ritual-step-title {
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.ritual-step-subtitle {
  font-size: 12.5px;
  color: var(--gold-primary);
  margin-top: 2px;
  letter-spacing: 2px;
  opacity: 0.85;
}

.ritual-step-items {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: 70px;
}

.ritual-step-item {
  display: flex;
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--text-secondary);
}

.ritual-step-item::before {
  content: '◆';
  color: var(--dao-teal);
  font-size: 10px;
  flex-shrink: 0;
  margin-top: 5px;
  opacity: 0.7;
}

/* 法则卡片组 */
.law-cards {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 0 20px;
  margin-bottom: 32px;
}

.law-card {
  background: rgba(28, 26, 24, 0.45);
  border: 1px solid rgba(91, 140, 90, 0.25);
  border-radius: 12px;
  padding: 18px 18px 16px;
  display: flex;
  gap: 14px;
  position: relative;
  overflow: hidden;
}

.law-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right, var(--dao-teal-dark), var(--dao-teal-light), var(--dao-teal-dark));
  opacity: 0.4;
}

.law-card-icon {
  color: var(--dao-teal-light);
  opacity: 0.9;
  flex-shrink: 0;
  margin-top: 2px;
}

.law-card-content {
  flex: 1;
}

.law-card-title {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.law-card-text {
  font-size: 13px;
  line-height: 1.85;
  color: var(--text-secondary);
}

/* 安全须知 / 小贴士 */
.notice-block {
  margin: 0 20px 24px;
  background: rgba(28, 26, 24, 0.4);
  border: 1px solid rgba(201, 169, 110, 0.14);
  border-radius: 12px;
  padding: 18px 18px 16px;
  position: relative;
  overflow: hidden;
}

.notice-block.cinnabar {
  border-color: rgba(169, 68, 56, 0.25);
}

.notice-block.cinnabar::before {
  border-color: rgba(169, 68, 56, 0.35);
}

.notice-block::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 30px; height: 30px;
  border-top: 2px solid var(--border-gold-strong);
  border-left: 2px solid var(--border-gold-strong);
  border-radius: 12px 0 0 0;
  opacity: 0.5;
}

.notice-title {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 2px;
}

.notice-title svg { color: var(--gold-primary); opacity: 0.75; }

.notice-block.cinnabar .notice-title svg { color: var(--cinnabar-light); opacity: 0.85; }

.notice-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
  list-style: none;
}

.notice-list li {
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-secondary);
  padding-left: 20px;
  position: relative;
}

.notice-list li::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 10px;
  width: 5px;
  height: 5px;
  background: var(--gold-primary);
  border-radius: 50%;
  opacity: 0.5;
}

.notice-block.cinnabar .notice-list li::before {
  background: var(--cinnabar);
  opacity: 0.6;
}

/* 底部免责 */
.disclaimer {
  margin: 16px 20px 8px;
  padding: 18px 16px 16px;
  border: 1px solid rgba(201, 169, 110, 0.12);
  border-radius: 10px;
  background: rgba(201, 169, 110, 0.02);
  position: relative;
}

.disclaimer::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(201, 169, 110, 0.3), transparent);
}

.disclaimer-title {
  font-family: var(--font-serif);
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--gold-dark);
  margin-bottom: 8px;
  text-align: center;
}

.disclaimer-text {
  font-size: 11.5px;
  line-height: 1.85;
  color: var(--text-muted);
  text-align: center;
}

/* section heading */
.section-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 12px 0 22px;
}

.section-heading-line {
  width: 48px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border-gold-strong));
}

.section-heading-line.right {
  background: linear-gradient(to left, transparent, var(--border-gold-strong));
}

.section-heading-text {
  font-family: var(--font-serif);
  font-size: 15px;
  letter-spacing: 5px;
  color: var(--gold-primary);
  font-weight: 600;
}

/* 仪式页通用氛围音按钮 */
.atmosphere-btn {
  margin: 0 20px 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 24px;
  background: linear-gradient(135deg, rgba(91, 140, 90, 0.15) 0%, rgba(91, 140, 90, 0.05) 100%);
  border: 1px solid rgba(91, 140, 90, 0.4);
  border-radius: 12px;
  color: var(--dao-teal-light);
  font-family: var(--font-serif);
  font-size: 14px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.atmosphere-btn:active {
  transform: scale(0.97);
  background: linear-gradient(135deg, rgba(91, 140, 90, 0.25) 0%, rgba(91, 140, 90, 0.1) 100%);
}

.atmosphere-btn .btn-icon {
  color: var(--dao-teal-light);
}

/* ===== 全局背景音乐按钮 ===== */
.bg-music-btn {
  position: fixed;
  top: calc(12px + var(--safe-top));
  right: 16px;
  z-index: 200;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(28, 26, 24, 0.8);
  border: 1px solid var(--border-gold);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-primary);
  cursor: pointer;
  transition: all 0.3s ease;
}

.bg-music-btn:active {
  transform: scale(0.92);
  background: rgba(201, 169, 110, 0.2);
}

.bg-music-btn.playing {
  animation: bgBtnPulse 3s ease-in-out infinite;
}

@keyframes bgBtnPulse {
  0%, 100% { box-shadow: 0 0 0 rgba(201, 169, 110, 0); }
  50% { box-shadow: 0 0 12px rgba(201, 169, 110, 0.4); }
}

.bg-music-btn.playing .music-note-1 {
  animation: noteFloat 1.5s ease-in-out infinite;
}

.bg-music-btn.playing .music-note-2 {
  animation: noteFloat 1.5s ease-in-out infinite 0.3s;
}

@keyframes noteFloat {
  0% { opacity: 0; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-2px); }
  100% { opacity: 0; transform: translateY(-4px); }
}

/* ===== 曲目列表播放器 ===== */
.track-list-section {
  margin: 0 20px 28px;
}

.track-list-title {
  font-family: var(--font-serif);
  font-size: 15px;
  letter-spacing: 4px;
  color: var(--gold-primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}

.track-list-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 16px;
  background: linear-gradient(to bottom, var(--gold-light), var(--gold-primary));
  border-radius: 2px;
}

.track-list {
  background: linear-gradient(135deg, rgba(28, 26, 24, 0.7) 0%, rgba(18, 17, 16, 0.7) 100%);
  border: 1px solid var(--border-gold-strong);
  border-radius: 14px;
  padding: 4px 0;
  overflow: hidden;
  position: relative;
}

.track-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(201, 169, 110, 0.08);
  cursor: pointer;
  transition: all 0.25s ease;
  gap: 14px;
  position: relative;
}

.track-item:last-child {
  border-bottom: none;
}

.track-item:active {
  background: rgba(201, 169, 110, 0.08);
}

.track-item.playing {
  background: rgba(201, 169, 110, 0.1);
}

.track-item.playing::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(to bottom, var(--gold-light), var(--gold-primary), var(--gold-dark));
}

.track-play-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
  border: none;
  color: #1A150E;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 3px 12px rgba(201, 169, 110, 0.3);
  flex-shrink: 0;
}

.track-play-btn:active {
  transform: scale(0.92);
}

.track-play-btn.loading {
  background: linear-gradient(135deg, var(--gold-dark), #4A3F2A);
  opacity: 0.7;
}

.track-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.track-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  font-family: var(--font-serif);
  letter-spacing: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-item.playing .track-name {
  color: var(--gold-light);
}

.track-time {
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  margin-left: 10px;
  opacity: 0.8;
}

.track-item.playing .track-time {
  color: var(--gold-primary);
  opacity: 0.85;
}

/* 底部总进度条 */
.track-progress-wrap {
  margin: 12px 16px 4px;
}

.track-progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(201, 169, 110, 0.15);
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}

.track-progress-fill {
  height: 100%;
  background: linear-gradient(to right, var(--gold-dark), var(--gold-primary), var(--gold-light));
  border-radius: 2px;
  transition: width 0.15s linear;
}

.track-progress-times {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.track-volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 16px 12px;
  border-top: 1px solid rgba(201, 169, 110, 0.08);
  margin-top: 8px;
  padding-top: 12px;
}

.track-volume-icon {
  color: var(--gold-primary);
  opacity: 0.6;
  flex-shrink: 0;
}

.track-volume-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: rgba(201, 169, 110, 0.15);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.track-volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold-primary);
  cursor: pointer;
  box-shadow: 0 0 6px rgba(201, 169, 110, 0.5);
}

.track-volume-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold-primary);
  cursor: pointer;
  border: none;
}

.track-loading-text {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
  opacity: 0.7;
}

/* ===== 加载遮罩（禅意版） ===== */
.loading-screen {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, #121110 0%, #0B0A09 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  font-family: var(--font-serif);
  transition: opacity 0.6s ease;
}

.loading-taiji {
  width: 60px;
  height: 60px;
  margin-bottom: 24px;
  animation: taijiSpin 6s linear infinite;
  opacity: 0.7;
}

.loading-brand {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 10px;
  margin-bottom: 8px;
  background: linear-gradient(180deg, #F5E6C8 0%, #C9A96E 50%, #8B7355 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  padding-left: 10px;
}

.loading-sub {
  font-size: 12px;
  letter-spacing: 5px;
  color: var(--text-muted);
  padding-left: 5px;
}

.loading-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

/* ===== 祈愿烛教学视频页 ===== */
.video-stage {
  position: relative;
  border: 1px solid var(--border-gold-strong);
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 0 0 1px rgba(201, 169, 110, 0.08),
              0 18px 46px rgba(0, 0, 0, 0.6);
  margin-bottom: 16px;
}

.tutorial-video {
  display: block;
  width: 100%;
  aspect-ratio: 9 / 16;
  background: #000;
  object-fit: contain;
}

.video-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 26px;
}

.video-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--text-secondary);
}

.video-meta-item svg {
  color: var(--gold-primary);
}

.video-meta-sep {
  font-size: 9px;
  color: rgba(201, 169, 110, 0.5);
}

/* 加载失败提示 */
.video-error {
  border: 1px solid rgba(169, 68, 56, 0.5);
  background: rgba(169, 68, 56, 0.08);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 20px;
  text-align: center;
}

.video-error-title {
  font-family: var(--font-serif);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--cinnabar-light);
  margin-bottom: 8px;
}

.video-error-text {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-muted);
  margin-bottom: 14px;
}

.video-error-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.video-error-btn {
  display: inline-block;
  padding: 9px 18px;
  border: 1px solid var(--border-gold-strong);
  border-radius: 20px;
  font-size: 12.5px;
  letter-spacing: 1px;
  color: var(--gold-light);
  text-decoration: none;
  cursor: pointer;
  transition: all 0.25s ease;
}

.video-error-btn.ghost {
  border-color: rgba(201, 169, 110, 0.3);
  color: var(--text-secondary);
}

.video-error-btn:active {
  transform: scale(0.97);
}

/* 本期要点 */
.video-points {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 30px;
}

.video-point {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 16px 18px;
}

.video-point-num {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border-gold-strong);
  background: rgba(201, 169, 110, 0.07);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--gold-primary);
}

.video-point-body { flex: 1; }

.video-point-title {
  font-family: var(--font-serif);
  font-size: 15px;
  letter-spacing: 1.5px;
  color: var(--gold-light);
  margin-bottom: 5px;
}

.video-point-desc {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-muted);
}

/* 响应式微调 */
@media (max-width: 360px) {
  .home-brand { font-size: 56px; letter-spacing: 12px; }
  .entry-card .card-title { font-size: 18px; letter-spacing: 3px; }
  .detail-name { font-size: 30px; letter-spacing: 8px; }
  .candle-name { font-size: 20px; letter-spacing: 5px; }
  .video-point { padding: 14px 15px; }
}

  <script>// ===== 云舒 · 冥想音乐引擎 v5 =====
//
// v4 → v5 变更（2026-09-22）：
//   1) 音乐改为播放「原创离线渲染音频文件」，不再是 Web Audio 实时合成。
//      原因：v4 全曲只有正弦波振荡器、没有任何混响、音符之间是数字静音，
//      听感像电子琴试音，不是冥想音乐。新音频用卷积混响 + 模态合成 + 持续垫音重做。
//   2) 三处播放位置各自独立成曲：

//        八首祈愿烛曲   → <trackId>.mp3          （各 180s）
//   3) 全部同源托管（github.io 同域），微信内置浏览器可直接播放。
//      v4 的实时合成器完整保留为兜底：任何文件加载失败都会自动回落，保证始终有声音。
//   4) 音量优先经 WebAudio GainNode —— iOS 上 <audio>.volume 是无效的。
//
// v4 原有说明（合成兜底部分）：
//   节点统一管理 + 立即停止 + 干净切换
//   风格：极简 · 稀疏 · 留白 · 古琴 · 箫/埙 · 钟声

  'use strict';

  // ============================================================
  // 音频文件地址（同源，务必与页面同域，否则微信无法播放）
  // ============================================================
  var AUDIO_BASE = (window.AUDIO_BASE) ||
    'https://exxx-dk.github.io/yunshu-guide/audio/';

  // 版本号必须拼在文件名之后（拼在目录后面会变成 /audio/?v=x/xx.mp3 这种废路径）。
  // github.io 的 max-age 是 600 秒，微信缓存更久，换版本号才能让用户拿到新音频。
  var AUDIO_VER = '20260922a';

  function trackUrl(fileOrId) {
    if (!fileOrId) return '';
    if (/^data:/.test(fileOrId)) return fileOrId;
    var u = /^(https?:)?\/\//.test(fileOrId) ? fileOrId : (AUDIO_BASE + fileOrId);

  // ============================================================

  var busReady = false;
  var busTried = false;

      if (!AC) return false;
      busCtx = new AC();

    }

    document.addEventListener('touchend', unlockOnce, true);
    document.addEventListener('mousedown', unlockOnce, true);
    document.addEventListener('click', unlockOnce, true);
